<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The plugin iframe never loads remote code. 'unsafe-inline' styles are needed
      for Vite's injected CSS; ws:/http://localhost:* keep dev-server HMR working.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://localhost:* http://localhost:*; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Callout Manager</title>
    <script type="module" src="/src/index.ts"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
